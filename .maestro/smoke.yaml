appId: com.bingobombo.app
---
# Phase 1 smoke flow: the app boots into the draw screen and one tap draws a
# ball. The full §8.5 flows (undo, restart, force-stop recovery) land in Phase 2,
# once board, history and settings exist.
- launchApp:
    clearState: true
- assertVisible: 'Sacar bola'
- assertVisible: 'Tocá «Sacar bola» para empezar.'
- tapOn: 'Sacar bola'
- assertVisible: '1 de 90'
